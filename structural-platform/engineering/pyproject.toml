[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "geekcalculus-structural-engine"
version = "1.1.0"
description = "Validated geometric models and analytical sectional properties in millimetres"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.4"]

[project.optional-dependencies]
api = ["fastapi==0.135.1", "uvicorn==0.42.0"]
test = ["pytest==9.0.2", "hypothesis==6.151.9", "mpmath==1.3.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["structural_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
