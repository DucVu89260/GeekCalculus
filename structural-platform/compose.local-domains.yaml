# docker compose -f compose.yaml -f compose.local-domains.yaml ...
services:
  backend:
    environment:
      APP_URL: http://geekcalculus.com
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/backend/laravel/database/database.sqlite
      SESSION_COOKIE: geekcalculus_main_session
      SESSION_DOMAIN: ""
      SESSION_SECURE_COOKIE: 'false'
  backend-test:
    image: composer:2@sha256:af98f42dfff7c68ba8d53c2164fd9fde1087b7d449514baa38c418b1f6bc4bac
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app/backend/laravel
    environment:
      APP_URL: http://geekcalculus.test
      APP_ENV: local
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/backend/laravel/database/database.sqlite
      LARAVEL_STORAGE_PATH: /test-data/storage
      SESSION_COOKIE: geekcalculus_test_session
      SESSION_DOMAIN: ""
      SESSION_SECURE_COOKIE: 'false'
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SECTION_ENGINE_URL: http://section-engine:8001
    volumes:
      - ./:/app
      - ./local/test-data:/test-data
      - ./backend/laravel/storage/app:/test-data/storage/app
    depends_on:
      backend:
        condition: service_healthy
    command: ["sh", "/app/scripts/backend-test-start.sh"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  frontend-test:
    image: node:24-alpine
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app/frontend/vue
    environment:
      BACKEND_PROXY_TARGET: http://backend-test:8000
      VITE_DEMO_MODE: 'false'
      VITE_BASE_PATH: /
      npm_config_cache: /tmp/npm-cache
    volumes:
      - ./:/app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
  local-web:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    ports:
      - "127.0.0.1:${LOCAL_WEB_PORT:-80}:80"
    volumes:
      - ./local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/vue/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
      backend-test:
        condition: service_healthy
      frontend-test:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -q -O /dev/null --header='Host: geekcalculus.com' http://127.0.0.1/api/health && wget -Y off -q -O /dev/null --header='Host: geekcalculus.test' http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
