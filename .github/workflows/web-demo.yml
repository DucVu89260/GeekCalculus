name: Build and publish GeekCalculus demo

on:
  pull_request:
    paths:
      - 'structural-platform/frontend/vue/**'
      - 'structural-platform/backend/laravel/**'
      - 'structural-platform/standards/**'
      - 'structural-platform/scripts/extract_standard_outline.py'
      - 'structural-platform/scripts/extract_aisc_formula_candidates.py'
      - 'structural-platform/scripts/extract_asce710_corpus.py'
      - 'structural-platform/scripts/requirements-standard-source.txt'
      - 'structural-platform/scripts/standards-editions.json'
      - 'structural-platform/scripts/tests/**'
      - 'structural-platform/scripts/build-section-properties-core.cjs'
      - 'structural-platform/section-properties/**'
      - 'structural-platform/tests/section-build-targets.test.cjs'
      - 'structural-platform/scripts/build-web-demo.sh'
      - '.github/workflows/web-demo.yml'
  push:
    branches: [main]
    paths:
      - 'structural-platform/backend/laravel/**'
      - 'structural-platform/standards/**'
      - 'structural-platform/scripts/extract_standard_outline.py'
      - 'structural-platform/scripts/extract_aisc_formula_candidates.py'
      - 'structural-platform/scripts/extract_asce710_corpus.py'
      - 'structural-platform/scripts/requirements-standard-source.txt'
      - 'structural-platform/scripts/standards-editions.json'
      - 'structural-platform/scripts/tests/**'
      - 'structural-platform/scripts/build-section-properties-core.cjs'
      - 'structural-platform/section-properties/**'
      - 'structural-platform/tests/section-build-targets.test.cjs'
      - 'structural-platform/frontend/vue/**'
      - 'structural-platform/scripts/build-web-demo.sh'
      - '.github/workflows/web-demo.yml'

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: structural-platform/frontend/vue
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: structural-platform/frontend/vue/package-lock.json
      - run: npm ci
      - name: Type-check Vue components
        run: npm run typecheck
      - name: Verify geometry and AISC engineering regressions
        run: npm test
      - name: Build GitHub Pages demo
        run: npm run build -- --outDir ../../../docs --emptyOutDir
        env:
          VITE_DEMO_MODE: 'true'
          VITE_BASE_PATH: /GeekCalculus/
      - name: Publish built demo to docs directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          touch docs/.nojekyll docs/.geekcalculus-demo-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "build(demo): publish Vue interface [skip ci]"
            git push
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: structural-platform/backend/laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install Laravel dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Test Laravel workspaces and standards registry
        run: php artisan test

  source-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR dependencies for synthetic ASCE corpus tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --list-langs
      - run: python -m pip install -r structural-platform/scripts/requirements-standard-source.txt
      - name: Verify indexing with synthetic PDFs only
        run: python -m unittest discover -s structural-platform/scripts/tests -v
