name: Build and publish GeekCalculus demo

on:
  pull_request:
    paths:
      - 'structural-platform/frontend/vue/**'
      - 'structural-platform/scripts/build-web-demo.sh'
      - '.github/workflows/web-demo.yml'
  push:
    branches: [main]
    paths:
      - 'structural-platform/frontend/vue/**'
      - 'structural-platform/scripts/build-web-demo.sh'
      - '.github/workflows/web-demo.yml'

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: structural-platform/frontend/vue
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: structural-platform/frontend/vue/package-lock.json
      - run: npm ci
      - name: Type-check Vue components
        run: npm run typecheck
      - name: Verify shared Section Properties integration for I/H
        run: node --test tests/geometry/hi-section-properties-integration.test.js
      - name: Verify AISC 360-10 ASD/LRFD resistance-factor modes
        run: node --test tests/geometry/hi-aisc36010-design-method.test.js
      - name: Build GitHub Pages demo
        run: npm run build -- --outDir ../../../docs --emptyOutDir
        env:
          VITE_DEMO_MODE: 'true'
          VITE_BASE_PATH: /GeekCalculus/
      - name: Publish built demo to docs directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          touch docs/.nojekyll docs/.geekcalculus-demo-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "build(demo): publish Vue interface [skip ci]"
            git push
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: structural-platform/backend/laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install Laravel dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Test Combo Generator Laravel workspace
        run: php artisan test --filter=ComboGeneratorWorkspaceTest
